<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var b64 = function(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
  var enc = new TextEncoder(), dec = new TextDecoder();
  var KEY_STORE = 'iek-gate-key';

  function deriveKey(email, password){
    var material = enc.encode(email.trim().toLowerCase() + '\u0000' + password);
    return crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function decryptWith(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct)).then(function(buf){ return dec.decode(buf); });
  }
  function launch(html){
    document.open(); document.write(html); document.close();
  }
  // Anahtarı hem localStorage'a hem çereze yaz (1 yıl). Biri silinse de diğeri kalır.
  function remember(key){
    return crypto.subtle.exportKey('raw', key).then(function(raw){
      var v = btoa(String.fromCharCode.apply(null, new Uint8Array(raw)));
      try { localStorage.setItem(KEY_STORE, v); } catch(e){}
      try { document.cookie = KEY_STORE + '=' + encodeURIComponent(v) + '; max-age=31536000; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : ''); } catch(e){}
    }).catch(function(){});
  }
  function readSaved(){
    var v = null;
    try { v = localStorage.getItem(KEY_STORE); } catch(e){}
    if (!v) { var m = document.cookie.match(new RegExp('(?:^|; )' + KEY_STORE + '=([^;]*)')); if (m) v = decodeURIComponent(m[1]); }
    return v;
  }
  function forget(){
    try { localStorage.removeItem(KEY_STORE); } catch(e){}
    try { document.cookie = KEY_STORE + '=; max-age=0; path=/'; } catch(e){}
  }

  // Daha önce giriş yapıldıysa otomatik aç
  try {
    var saved = readSaved();
    if (saved) {
      crypto.subtle.importKey('raw', b64(saved), {name:'AES-GCM'}, true, ['decrypt'])
        .then(function(key){ return decryptWith(key).then(function(html){ return remember(key).then(function(){ launch(html); }); }); })
        .catch(forget);
    }
  } catch(e){}

  document.getElementById('gate').addEventListener('submit', function(ev){
    ev.preventDefault();
    var btn = document.getElementById('btn'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = ''; btn.textContent = 'Kontrol ediliyor…';
    var email = document.getElementById('email').value, pw = document.getElementById('password').value;
    deriveKey(email, pw).then(function(key){
      return decryptWith(key).then(function(html){ return remember(key).then(function(){ launch(html); }); });
    }).catch(function(){
      err.textContent = 'E-posta veya şifre yanlış.';
      btn.disabled = false; btn.textContent = 'Oyuna gir';
    });
  });
})();
</script>
